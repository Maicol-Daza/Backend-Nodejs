<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD DE personas e imagenes</title>
</head>
<body>
    
    <h1>Gestion de personas</h1>

    <form id="personaForm">
        <input type="hidden" id="id_persona">

        <div>
            <label>Nombre: 
                <input type="text" id="nombre" required></label>
        </div>

        <div>
            <label>Apellido: 
                <input type="text" id="nombre" required></label>
        </div>


            <div>
                <label for="tipo_identificacion">Tipo de identificacion:
                <select id="tipo_identificacion">
                    <option value="CC">Cedula de ciudadania</option>
                    <option value="TI">Tarjeta de Identidad</option>
                    <option value="CE">Cedula de Extranjero</option>
                </select>
            </label>
            </div>

            <div>
                <label>Numero de identificacion: 
                    <input type="number" id="nuip" required></label>
            </div>
    
            <div>
                <label>Email: 
                    <input type="email" id="email" required></label>
            </div>

            <div>
                <label>Contraseña: 
                    <input type="password" id="clave" required></label>
            </div>

            <div>
                <label>salario: 
                    <input type="number" id="salario" step="0.01" required></label>
            </div>
    
            <div>
                <label>Activo: 
                    <input type="checkbox" id="activo" required></label>
            </div>
    
    
            <div>
                <label for="imagen">Imagen:</label>
                <input type="file" id="imagen" accept="image/*">
                <img id="previewImagen" style="max-width: 200px; display: none;">
            </div>
    
            <button type="submit" id="btnGuardar">Guardar</button>
            <button type="button" id="btnCancelar">Cancelar</button>
        </form>

        <table id="tablaPersonas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Imagen</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaPersonas">

            </tbody>
        </table>

        <template id="template">
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                    <button class="btn-editar" >Editar</button>
                    <button class="btn-eliminar">Eliminar</button>
                </td>
            </tr>
        </template>
        <script src="index_query.js"></script>
</body>
</html>
